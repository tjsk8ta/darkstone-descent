name: Verify Darkstone rules engine
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci || npm install
      - name: Unit tests
        run: npm test
        id: unit_tests
        continue-on-error: true
      - run: npx playwright install --with-deps chromium
      - name: Chromium browser tests
        run: npm run test:e2e -- --reporter=line,html
        id: browser_tests
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkstone-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Fail verification if either test suite failed
        if: always()
        run: |
          test '${{ steps.unit_tests.outcome }}' = 'success'
          test '${{ steps.browser_tests.outcome }}' = 'success'
