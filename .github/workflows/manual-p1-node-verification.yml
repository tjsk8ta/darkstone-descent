name: Manual P1 full-repository Node verification
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Optional exact 40-character commit SHA; leave blank to test current main'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  full-node-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate pinned commit input
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if [[ -n "$TARGET_SHA" ]]; then
            [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid exact commit SHA'; exit 2; }
          fi
      - name: Checkout exact repository commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify exact HEAD
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Requested SHA: $TARGET_SHA"
          echo "Checked-out SHA: $actual"
          if [[ -n "$TARGET_SHA" ]]; then test "$actual" = "$TARGET_SHA"; fi
          echo "Verified checkout SHA: $actual"
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute full repository npm test and preserve exit code
        shell: bash
        run: |
          node --version
          npm --version
          set +e
          npm test 2>&1 | tee p1-npm-test.log
          status=${PIPESTATUS[0]}
          set -e
          echo "npm test exit code: $status"
          printf 'npm test exit code: %s\n' "$status" > p1-exit-code.txt
          exit "$status"
      - name: Upload test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-node-evidence-${{ github.run_id }}
          path: |
            p1-npm-test.log
            p1-exit-code.txt
          if-no-files-found: warn
